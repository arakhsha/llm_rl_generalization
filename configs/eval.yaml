defaults:
  - _self_
  - paths: default
  - model: qwen3_1_7b
  - data: gsm8k

seed: 42
# LoRA adapter directory (e.g. <run_dir>/final_adapter); null evaluates the base model.
adapter_path: null
split: test
limit: null
max_new_tokens: 1024
max_model_len: 2048
gpu_memory_utilization: 0.85

wandb:
  enabled: true
  project: llm_rl_generalization
  entity: null

hydra:
  run:
    dir: ${paths.output_root}/eval/${now:%Y%m%d-%H%M%S}-${oc.env:SLURM_JOB_ID,local}
  job:
    chdir: false
