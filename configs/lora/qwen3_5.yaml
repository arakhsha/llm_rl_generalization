# Passed verbatim to peft.LoraConfig.
r: 32
lora_alpha: 64
lora_dropout: 0.0
# Every linear layer of the language model: full attention, Gated DeltaNet and MLP projections.
# Listed by name because 'all-linear' would also adapt the unused vision tower.
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_a
  - in_proj_b
  - out_proj
  - gate_proj
  - up_proj
  - down_proj
bias: none
task_type: CAUSAL_LM
