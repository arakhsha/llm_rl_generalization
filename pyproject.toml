[project]
name = "llm-rl-generalization"
version = "0.1.0"
description = "RL fine-tuning experiments on LLMs (GRPO + LoRA) on GSM8K and ALFWorld, with WebShop evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # vllm 0.31.0 pins torch==2.13.0 and transformers<5.18; uv.lock records the exact resolution.
    "vllm==0.31.0",
    "trl[vllm]==1.15.0",
    "peft==0.21.2",
    "transformers",
    "accelerate",
    "datasets",
    "hydra-core==1.3.7",
    "wandb==0.30.0",
    # Text-only ALFWorld (TextWorld PDDL backend); fast-downward-textworld and jericho build from source.
    "alfworld==0.4.2",
    # Triton kernels for Qwen3.5's Gated DeltaNet layers; without it transformers falls back to a slow torch loop.
    "flash-linear-attention==0.5.2",
    # WebShop evaluation: imports of WebShop's environment code (cloned by scripts/setup_webshop.sbatch).
    # pyserini runs the Lucene search engine on Java 21 (module java/21.0.1); spaCy's small English model
    # is used in WebShop's reward.
    "pyserini==2.4.0",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "flask",
    "beautifulsoup4",
    "thefuzz",
    "rich",
    "cleantext",
    "rank-bm25",
    "gym==0.26.2",
    "selenium",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Use the uv-managed interpreter, not the CVMFS/system Pythons that may be on PATH.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "llm_rl"

[tool.pytest.ini_options]
testpaths = ["tests"]
